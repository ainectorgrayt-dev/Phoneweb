<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>try2</title>
  <style>
    body{
      background-image: url('background.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      min-height: 100vh;
      font-family: Arial;
      color: white;
    }
    .nav-div{
      display: flex;
      min-height: 100vh;
    }
    .side-bar{
      background-color: black;
      flex-direction: column;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
    }
    img{
      height: 50px;
      width: 50px;
      margin: 30px 20px 0px 20px;
      border-radius: 50px;
    }
    .profile{
      border-radius: 50px;
      height: 70px;
      width: 70px;
      margin-top: 19px;
    }
    .icon{
      background-color: rgb(247, 244, 244) ;
    }
    .discript{
      display: flex;
      flex-direction: column;
      margin-left: 120px;
      margin-top: 80px;
      font-size: 25px;
    }
    h1{
      margin-bottom: 0px;
    }
    h2{
      margin-bottom: 0px;
    }
    .what{
      margin-left: 10px;
    }
    button{
      padding: 15px 20px 15px 20px;
      width: 200px;
      background-color: aqua;
      color: azure;
      font-weight: bolder;
      border-radius: 50px;
      border:none;
      box-shadow: none;
    }
    p{
      font-size: 12px;
      margin: 0px 0px 0px 30px;
    }
  </style>
</head>
<body>
  <div class="nav-div">
    <div class="side-bar">
      <div>
        <img src="Pro.jpeg" class="profile">
      </div>
      <div>
        <img src="Home.png">
        <p>Home</p>
      </div>
      <div>
        <img src="Profile.png" class="icon">
        <p>About</p>
      </div>
      <div>
        <img src="Bulb.png" class="icon">
        <p class="what">What You Get</p>
      </div>
      <div>
        <img src="Bag.jpeg">
        <p>Design</p>
      </div>
      <div>
        <img src="Heart.png" class="icon">
        <p class="what">Testmonials</p>
      </div>
    </div>
    <div class="main-content">
      <div class="discript">
         <h1>ONE PAGE WEBSITES </h1>
         <h2>SIMPLE BUT SIGNIFICANT.</h2>
         <h5>BY ONE PAGE WEBSITE PRO</h5>
         <button>LEARN MORE</button>
      </div>
    </div>
  </div>
</body>
</html>
