<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wait</title>
  <style>
    .go{
      background-color: rgb(12, 14, 14);
      font-size: 15px;
      position: relative;
      transform-style:preserve-3d ;
      transform: perspective(1000px);
      animation: gallery 20% linear infinite;
      cursor: pointer;
      border-radius: 20px;
      border-style: groove;
      margin-bottom: 80px;
      margin-left: 20px;
      padding-left: 20px;
      padding-right: 20px;
      color: white;
    }
    .back{
       background-color: rgb(10, 197, 230);
      transition: all 0.2s ease;
      font-size: 30px;
      border-color: aqua;
      color: rgba(237, 237, 241, 0.61);
      font-weight: bold;
      margin-left: 80px;
      margin-top:300px;
      border-top-right-radius: 20px;
      border-bottom-left-radius: 20px;
      padding-bottom: 10px;
      padding-top: 10px;
      padding-left: 10px;
      padding-right: 10px;


    }
    .back:hover{
       transform: translateX(4px);
      box-shadow: 0 8px 16px rgba(218, 236, 241, 0.3);
      background-color: black;
      border-color: azure;
      cursor: pointer;
    }
    *{
      margin: 0;
      padding: 0;
      box-sizing: 0;
    }
    body{
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    .div-circle{
      position: absolute;
      top: 30%;
      height: 90%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .circle{
      position: absolute;
      background: transparent;
      width: calc(var(--i)*2.5min);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid rgb(0, 255, 13);
      transform-style:preserve-3d ;
      transform: rotateX('70deg') translateZ(50px);
      animation: animate 3s ease-in-out calc(var(--i)*0.08s) infinite;
      box-shadow: 0 0 15px rgb(124, 124,124),
      inset 0 0 15px rgb(124, 124, 124);
    }
    @keyframes animate{
      0%,
      100%{
        transform: rotateX(70deg) translateZ(50px)
        translateY(0);
        filter: hue-rotate(0);
      }
      50%{
        transform: rotateX(70deg) translateZ(50px)
        translateY(-50vmin);
        filter:hue-rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="go" style="--i:1" >
    COMING SOON
  </div>
  <div class="div-circle">
    <div class="circle" style="--i:0;"></div>
    <div class="circle" style="--i:1;">o</div>
    <div class="circle" style="--i:2;">oo</div>
    <div class="circle" style="--i:3;">ooo</div>
    <div class="circle" style="--i:4;">oooo</div>
    <div class="circle" style="--i:5;">ooooo</div>
    <div class="circle" style="--i:6;">oooooo</div>
    <div class="circle" style="--i:7;">oooooo</div>
    <div class="circle" style="--i:8;">oooooooo</div>
    <div class="circle" style="--i:9;">ooooooooo</div>
    <div class="circle" style="--i:10;">ooooooooo</div>
    <div class="circle" style="--i:11;">ooooooooo</div>
    <div class="circle" style="--i:12;">oooooooo</div>
    <div class="circle" style="--i:13;">ooooooo</div>
     <div class="circle" style="--i:14;">oooooo</div>
    <div class="circle" style="--i:15;">ooooo</div>
    <div class="circle" style="--i:16;">oooo</div>
    <div class="circle" style="--i:17;">ooo</div>
    <div class="circle" style="--i:18;">oo</div>
    <div class="circle" style="--i:19;">o</div>
    <div class="circle" style="--i:20;"></div>
   
  </div>
  <div><a href="kampalafix.html">
    <button class="back">BACK</button>
  </a></div>
</body>
</html>
